# GUDTEK: recorre DexScreener, actualiza la lista compartida de tokens y publica la web en GitHub Pages.
# Cada ejecución da 6 vueltas de ~70 s y publica al terminar cada vuelta (≈ cada 1,5 min).
# Al terminar, cada ejecución lanza la siguiente, así que el robot trabaja sin pausa.
# El cron de cada 5 min es solo un respaldo por si la cadena se corta (GitHub suele retrasarlo).
name: Update GUDTEK

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: gudtek-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy6.outputs.page_url }}
    env:
      RUN_MS: '70000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html site/index.html
          touch site/.nojekyll

      # ---------- vuelta 1 ----------
      - name: Crawl 1
        run: node crawler/crawl.mjs
        env:
          PREV_URL: ${{ steps.pages.outputs.base_url }}/tokens.json
          OUT: site/tokens.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site, name: pages-1 }
      - id: deploy1
        uses: actions/deploy-pages@v4
        with: { artifact_name: pages-1 }

      # ---------- vuelta 2 ----------
      - name: Crawl 2
        run: node crawler/crawl.mjs
        env:
          PREV_FILE: site/tokens.json
          OUT: site/tokens.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site, name: pages-2 }
      - id: deploy2
        uses: actions/deploy-pages@v4
        with: { artifact_name: pages-2 }

      # ---------- vuelta 3 ----------
      - name: Crawl 3
        run: node crawler/crawl.mjs
        env:
          PREV_FILE: site/tokens.json
          OUT: site/tokens.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site, name: pages-3 }
      - id: deploy3
        uses: actions/deploy-pages@v4
        with: { artifact_name: pages-3 }

      # ---------- vuelta 4 ----------
      - name: Crawl 4
        run: node crawler/crawl.mjs
        env:
          PREV_FILE: site/tokens.json
          OUT: site/tokens.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site, name: pages-4 }
      - id: deploy4
        uses: actions/deploy-pages@v4
        with: { artifact_name: pages-4 }

      # ---------- vuelta 5 ----------
      - name: Crawl 5
        run: node crawler/crawl.mjs
        env:
          PREV_FILE: site/tokens.json
          OUT: site/tokens.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site, name: pages-5 }
      - id: deploy5
        uses: actions/deploy-pages@v4
        with: { artifact_name: pages-5 }

      # ---------- vuelta 6 ----------
      - name: Crawl 6
        run: node crawler/crawl.mjs
        env:
          PREV_FILE: site/tokens.json
          OUT: site/tokens.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site, name: pages-6 }
      - id: deploy6
        uses: actions/deploy-pages@v4
        with: { artifact_name: pages-6 }

      # ---------- encadenar: lanza la siguiente ejecución ----------
      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --repo ${{ github.repository }} --ref main
