# GUDTEK: recorre DexScreener, actualiza la lista compartida de tokens y publica la web en GitHub Pages.
# Cada ejecución da 3 vueltas de ~2 min y publica al terminar cada vuelta (≈ cada 2,5 min).
# Se lanza cada 5 min; si la anterior sigue en marcha, espera a que termine, así que el robot trabaja casi sin pausa.
name: Update GUDTEK

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gudtek-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url }}
    env:
      RUN_MS: '125000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html site/index.html
          touch site/.nojekyll

      # ---------- vuelta 1 ----------
      - name: Crawl 1
        run: node crawler/crawl.mjs
        env:
          PREV_URL: ${{ steps.pages.outputs.base_url }}/tokens.json
          OUT: site/tokens.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site, name: pages-1 }
      - id: deploy1
        uses: actions/deploy-pages@v4
        with: { artifact_name: pages-1 }

      # ---------- vuelta 2 ----------
      - name: Crawl 2
        run: node crawler/crawl.mjs
        env:
          PREV_FILE: site/tokens.json
          OUT: site/tokens.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site, name: pages-2 }
      - id: deploy2
        uses: actions/deploy-pages@v4
        with: { artifact_name: pages-2 }

      # ---------- vuelta 3 ----------
      - name: Crawl 3
        run: node crawler/crawl.mjs
        env:
          PREV_FILE: site/tokens.json
          OUT: site/tokens.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site, name: pages-3 }
      - id: deploy3
        uses: actions/deploy-pages@v4
        with: { artifact_name: pages-3 }
